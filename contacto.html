<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - TechNova</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0 0 60px 0; background-color: #f4f4f9; color: #333; }
        header { background-color: #1a1a2e; color: #fff; padding: 20px; text-align: center; }
        header h1 { margin: 0 0 10px 0; }
        nav a { color: #fff; margin: 0 15px; text-decoration: none; font-weight: bold; }
        nav a:hover { color: #00adb5; }
        nav a.active { color: #00adb5; border-bottom: 2px solid #00adb5; padding-bottom: 3px; }
        .container { padding: 40px 20px; max-width: 600px; margin: 30px auto; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        form { display: flex; flex-direction: column; }
        label { margin-top: 10px; font-weight: bold; }
        input, textarea { padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; width: 100%; }
        button { margin-top: 15px; padding: 10px; background-color: #00adb5; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #007b80; }
        footer { background-color: #1a1a2e; color: #fff; text-align: center; padding: 15px; position: fixed; width: 100%; bottom: 0; left: 0; }
    </style>
</head>
<body>

    <header>
        <h1>TechNova</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="productos.html">Productos</a>
            <a href="contacto.html" class="active">Contacto</a>
        </nav>
    </header>

    <div class="container">
        <h2>Ponte en Contacto</h2>
        <form action="#" method="post">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>

            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" placeholder="tu@email.com" required>

            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>

            <button type="submit">Enviar Mensaje</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2026 TechNova. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
