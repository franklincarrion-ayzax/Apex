<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Apex Tech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        apex: {
                            red: '#FF1E27',
                            redDark: '#C4151B',
                            dark: '#0A0B0E',
                            card: '#12141A',
                            border: '#1F2430'
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-apex-dark text-slate-100 font-sans antialiased min-h-screen flex flex-col selection:bg-apex-red selection:text-white">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-apex-dark/95 backdrop-blur-md border-b border-apex-border">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 group">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-apex-red to-red-500 flex items-center justify-center font-bold text-xl shadow-lg group-hover:scale-105 transition-transform">A</div>
                <span class="font-extrabold text-2xl tracking-wider text-white">APEX<span class="text-apex-red">TECH</span></span>
            </a>

            <nav class="hidden md:flex items-center gap-8 text-sm font-semibold uppercase tracking-wider">
                <a href="index.html" class="text-slate-300 hover:text-apex-red transition">Inicio</a>
                <a href="productos.html" class="text-slate-300 hover:text-apex-red transition">Productos</a>
                <a href="contacto.html" class="text-apex-red hover:text-apex-red transition">Contacto</a>
            </nav>

            <div class="flex items-center gap-4">
                <button id="open-cart-btn" class="relative p-2.5 rounded-xl bg-apex-card border border-apex-border text-slate-200 hover:text-white hover:border-apex-red/50 transition">
                    <i data-lucide="shopping-cart" class="w-5 h-5"></i>
                    <span id="cart-count" class="absolute -top-1.5 -right-1.5 bg-apex-red text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center shadow-md">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow py-16 max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 w-full">
        <div class="text-center mb-12">
            <h1 class="text-3xl sm:text-5xl font-extrabold text-white">Ponte en Contacto</h1>
            <p class="text-slate-400 mt-3">¿Tienes dudas con tu pedido o necesitas asesoramiento técnico? Escríbenos.</p>
        </div>

        <form id="contact-form" class="bg-apex-card border border-apex-border p-8 rounded-2xl shadow-xl space-y-6">
            <div>
                <label for="name" class="block text-sm font-medium text-slate-300 mb-2">Nombre completo</label>
                <input type="text" id="name" required class="w-full bg-apex-dark border border-apex-border rounded-xl px-4 py-3 text-white focus:outline-none focus:border-apex-red transition" placeholder="Tu nombre">
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-slate-300 mb-2">Correo Electrónico</label>
                <input type="email" id="email" required class="w-full bg-apex-dark border border-apex-border rounded-xl px-4 py-3 text-white focus:outline-none focus:border-apex-red transition" placeholder="tu@email.com">
            </div>

            <div>
                <label for="message" class="block text-sm font-medium text-slate-300 mb-2">Mensaje</label>
                <textarea id="message" rows="5" required class="w-full bg-apex-dark border border-apex-border rounded-xl px-4 py-3 text-white focus:outline-none focus:border-apex-red transition" placeholder="Escribe tu mensaje aquí..."></textarea>
            </div>

            <button type="submit" class="w-full py-4 bg-apex-red hover:bg-apex-redDark text-white font-bold rounded-xl shadow-lg transition">
                Enviar Mensaje
            </button>
        </form>
    </main>

    <!-- Footer -->
    <footer class="bg-apex-card border-t border-apex-border py-10 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-slate-400 text-sm">
            <p>&copy; 2026 APEX TECH. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Cart Drawer -->
    <div id="cart-drawer" class="fixed inset-0 z-50 invisible transition-all duration-300">
        <div id="cart-backdrop" class="absolute inset-0 bg-black/70 backdrop-blur-sm opacity-0 transition-opacity"></div>
        <div id="cart-panel" class="absolute right-0 top-0 bottom-0 w-full max-w-md bg-apex-card border-l border-apex-border shadow-2xl flex flex-col translate-x-full transition-transform">
            <div class="p-6 border-b border-apex-border flex items-center justify-between">
                <h3 class="text-xl font-bold text-white flex items-center gap-2">
                    <i data-lucide="shopping-cart" class="w-5 h-5 text-apex-red"></i> Mi Carrito
                </h3>
                <button id="close-cart-btn" class="text-slate-400 hover:text-white p-1 rounded-lg">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            <div id="cart-items" class="flex-grow p-6 overflow-y-auto space-y-4"></div>
            <div class="p-6 border-t border-apex-border bg-apex-dark/50">
                <div class="flex justify-between items-center mb-6">
                    <span class="text-slate-400 font-medium">Total:</span>
                    <span id="cart-total" class="text-2xl font-black text-apex-red">$0.00</span>
                </div>
                <button id="checkout-btn" class="w-full py-4 bg-apex-red hover:bg-apex-redDark text-white font-bold rounded-xl shadow-lg transition">
                    Finalizar Compra
                </button>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
