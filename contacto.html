<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactos | Apex Tech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a class="logo" href="index.html"><i data-lucide="cpu" style="color:var(--accent-red)"></i> APEX <span>TECH</span></a>
            <ul class="nav-links">
                <li><a class="nav-link" href="index.html">Inicio</a></li>
                <li><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                <li><a class="nav-link" href="productos.html">Productos</a></li>
                <li><a class="nav-link active" href="contactos.html">Contactos</a></li>
            </ul>
            <button class="cart-btn" id="cart-btn" aria-label="Carrito">
                <i data-lucide="shopping-cart"></i>
                <span class="cart-badge" id="cart-count">0</span>
            </button>
        </div>
    </header>

    <main>
        <h1 class="page-title">CONTÁCTA<span>NOS</span></h1>
        <p class="page-text">¿Dudas sobre algún equipo? Escríbenos y te respondemos lo antes posible.</p>

        <form id="contact-form">
            <div>
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" required>
            </div>
            <div>
                <label for="correo">Correo</label>
                <input type="email" id="correo" required>
            </div>
            <div>
                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" rows="5" required></textarea>
            </div>
            <button class="btn-primary" type="submit">Enviar</button>
            <p id="form-msg"></p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 <span>Apex Tech</span>. Todos los derechos reservados.</p>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
